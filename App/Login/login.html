<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>VisuAL-1 · Log in</title>
<link rel="stylesheet" href="../Common/BaseStyle.css"/>
<link rel="stylesheet" href="login.css"/>
</head>
<body>

<div id="topbar">
  <a class="logo" href="../Home.html">VisuAL-1</a>
  <div class="spacer"></div>
  <a class="topbar-back" href="../Home.html">← Home</a>
</div>

<div id="login-wrap">
  <div class="login-card">
    <h2 id="login-title">Log in</h2>
    <div class="login-sub">
      Signing in lets you save your work and create shareable links.
      Every tool works without an account.
    </div>

    <div class="login-actions">
      <button class="btn" id="btn-oauth-google">Continue with Google</button>
      <button class="btn" id="btn-oauth-github">Continue with GitHub</button>
    </div>
    <div class="login-divider"><span>or use email</span></div>

    <div class="login-field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="email" placeholder="you@example.com"/>
    </div>
    <div class="login-field" id="pw-field">
      <label for="login-pw">Password</label>
      <input type="password" id="login-pw" autocomplete="current-password" placeholder="••••••••"/>
    </div>
    <div class="login-field" id="pw2-field" style="display:none">
      <label for="login-pw2">Confirm password</label>
      <input type="password" id="login-pw2" autocomplete="new-password" placeholder="••••••••"/>
    </div>

    <div class="login-msg" id="login-msg"></div>
    <button class="btn" id="btn-resend" style="display:none">Resend confirmation email</button>

    <div class="login-actions">
      <button class="btn primary" id="btn-login">Log in</button>
      <button class="btn" id="btn-magic">
        Email me a magic link</button>
      <div class="btn-caption">No password needed — we email you a one-time
        sign-in link instead.</div>
    </div>

    <div class="login-alt" id="login-alt">
      No account yet? <a id="toggle-signup">Sign up</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Common/auth.js"></script>
<script>
'use strict';

let signupMode = false;
let pendingEmail = '';

function showResend(email) {
  pendingEmail = email;
  document.getElementById('btn-resend').style.display = 'block';
}

function msg(text, cls) {
  const el = document.getElementById('login-msg');
  el.textContent = text;
  el.className = 'login-msg' + (cls ? ' ' + cls : '');
}

function setMode(signup) {
  signupMode = signup;
  document.getElementById('login-title').textContent = signup ? 'Sign up' : 'Log in';
  document.getElementById('btn-login').textContent   = signup ? 'Create account' : 'Log in';
  document.getElementById('pw2-field').style.display = signup ? 'block' : 'none';
  document.getElementById('login-pw').autocomplete   = signup ? 'new-password' : 'current-password';
  document.getElementById('login-alt').innerHTML = signup
    ? 'Already have an account? <a id="toggle-signup">Log in</a>'
    : 'No account yet? <a id="toggle-signup">Sign up</a>';
  document.getElementById('toggle-signup')
    .addEventListener('click', () => setMode(!signupMode));
  msg('');
}

async function submit() {
  if (!sb) return;
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pw').value;
  if (!email) return msg('Enter your email.', 'err');
  if (!password) return msg('Enter a password.', 'err');
  if (signupMode) {
    const pw2 = document.getElementById('login-pw2').value;
    if (password !== pw2) return msg('Passwords do not match.', 'err');
  }
  msg('…');
  const { error } = signupMode
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) {
    if (/confirm/i.test(error.message)) showResend(email);
    return msg(error.message, 'err');
  }
  if (signupMode) {
    showResend(email);
    return msg('Account created — check your inbox to confirm, then log in.', 'ok');
  }
  location.href = '../Home.html';
}

async function magicLink() {
  if (!sb) return;
  const email = document.getElementById('login-email').value.trim();
  if (!email) return msg('Enter your email first.', 'err');
  msg('…');
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: location.origin + location.pathname.replace(/Login\/login\.html$/, 'Home.html') },
  });
  if (error) return msg(error.message, 'err');
  msg('Magic link sent — check your inbox.', 'ok');
}

async function oauth(provider) {
  if (!sb) return;
  msg('…');
  const { error } = await sb.auth.signInWithOAuth({
    provider,
    options: { redirectTo: location.origin + location.pathname.replace(/Login\/login\.html$/, 'Home.html') },
  });
  if (error) msg(error.message, 'err');
}

async function resendConfirmation() {
  if (!sb) return;
  const email = pendingEmail || document.getElementById('login-email').value.trim();
  if (!email) return msg('Enter your email first.', 'err');
  msg('…');
  const { error } = await sb.auth.resend({ type: 'signup', email });
  if (error) return msg(error.message, 'err');
  msg('Confirmation email resent — check your inbox and spam folder.', 'ok');
}

document.getElementById('btn-resend').addEventListener('click', resendConfirmation);
document.getElementById('btn-oauth-google').addEventListener('click', () => oauth('google'));
document.getElementById('btn-oauth-github').addEventListener('click', () => oauth('github'));
document.getElementById('btn-login').addEventListener('click', submit);
document.getElementById('btn-magic').addEventListener('click', magicLink);
document.getElementById('login-pw').addEventListener('keydown',
  e => { if (e.key === 'Enter') submit(); });
document.getElementById('toggle-signup').addEventListener('click', () => setMode(true));

if (!authConfigured) {
  document.getElementById('config-note').style.display = 'block';
  document.getElementById('btn-login').disabled = true;
  document.getElementById('btn-magic').disabled = true;
  document.getElementById('btn-oauth-google').disabled = true;
  document.getElementById('btn-oauth-github').disabled = true;
  document.getElementById('btn-resend').disabled = true;
}

authSession().then(s => { if (s) location.href = '../Home.html'; });
</script>
</body>
</html>

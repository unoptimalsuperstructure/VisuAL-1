<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>VisuAL-1</title>
<link rel="stylesheet" href="BaseStyle.css" />
<link rel="stylesheet" href="Home.html"/>
</head>
<body>

<div id="topbar">
  <div class="logo">VisuAL-1</div>
  <div class="version">Milestone 1</div>
  <div class="spacer"></div>
  <!-- Maybe log in button? -->
</div>

<div id="main">

  <!-- ── Left nav ── -->
  <div id="home-nav">
    <div class="nav-section-label">Tools</div>

    <div class="tool-card" id="card-sandbox"
         onmouseenter="previewTool('sandbox')"
         onmouseleave="clearPreview()"
         onclick="openTool('./3d/3d.html')">
      <div class="tool-card-name">3D Sandbox</div>
      <div class="tool-card-sub">Linear transformations</div>
    </div>

    <div class="tool-card" id="card-markov"
         onmouseenter="previewTool('markov')"
         onmouseleave="clearPreview()"
         onclick="openTool('./markov/markov.html')">
      <div class="tool-card-name">Markov Chains</div>
      <div class="tool-card-sub">Graph editor &amp; simulation</div>
    </div>

  </div>

  <!-- ── Preview pane ── -->
  <div id="home-preview">
    <div id="home-preview-default">VisuAL-1</div>
    <div id="home-preview-title"  style="display:none"></div>
    <div id="home-preview-desc"   style="display:none"></div>
    <!-- <a   id="home-open-btn"       href="#">Open →</a> -->
    <!-- Will redesign web on another day -->
  </div>
 
</div>

<script>

const TOOLS = {
  sandbox: {
    name: '3D Sandbox',
    desc: 'Visualise linear algebra transformations in three dimensions. ' +
          'Add shapes, apply translations, reflections, rotations, projections, ' +
          'and scaling, then watch the transformation matrix stack build up.',
    href: './3d/3d.html',
  },
  markov: {
    name: 'Markov Chains',
    desc: 'Build a Markov chain by placing nodes and drawing edges with weights. ' +
          'Step through the simulation and watch probability mass flow between states ' +
          'until the distribution converges.',
    href: './markov/markov.html',
  },
};

function previewTool(id) {
  const t = TOOLS[id];
  document.getElementById('home-preview-default').style.display = 'none';
  document.getElementById('home-preview-title').style.display  = 'block';
  document.getElementById('home-preview-desc').style.display   = 'block';
  document.getElementById('home-preview-title').textContent    = t.name;
  document.getElementById('home-preview-desc').textContent     = t.desc;
  document.getElementById('home-open-btn').style.display       = 'inline-block';
  document.getElementById('home-open-btn').href                = t.href;
  document.querySelectorAll('.tool-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card-' + id).classList.add('active');
}

function clearPreview() {
  document.getElementById('home-preview-default').style.display = 'block';
  document.getElementById('home-preview-title').style.display   = 'none';
  document.getElementById('home-preview-desc').style.display    = 'none';
  document.getElementById('home-open-btn').style.display        = 'none';
  document.querySelectorAll('.tool-card').forEach(c => c.classList.remove('active'));
}

function openTool(href) {
  window.location.href = href;
}

</script>
</body>
</html>

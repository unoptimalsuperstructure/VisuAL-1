<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>3d viewport</title>
  <link rel="stylesheet" href="../Common/BaseStyle.css"/>
  <link rel="stylesheet" href="3d.css"/>
  <link rel="stylesheet" href="../Common/tooltip.css"/>
</head>
<body>

<div id="topbar">
  <a class="logo" href="../Home.html">VisuAL-1</a>
  <div class="spacer"></div>
  <a class="topbar-back" href="../Home.html">← Home</a>
</div>

<div id="main">
  <div id="sidebar">
    <div class="section">
      <div class="section-head" id="shead-objects" onclick="toggleSection('objects')">
        Objects
        <span style="display:flex;align-items:center;gap:6px;">
          <span id="obj-count-badge" class="tag">1</span>
        </span>
      </div>
      <div class="section-body" id="section-objects">
        <div id="obj-list"></div>
        <button class="btn primary" onclick="toggleAddMenu()" id="add-obj-btn">
          Add Object
        </button>
        <div id="add-menu">
          <div class="menu-header">Choose type</div>
          <div id="shape-options"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head" id="shead-transforms" onclick="toggleSection('transforms')">
        Transformations
      </div>
      <div class="section-body" id="section-transforms">
        <button class="btn" onclick="openModal('translate')">
          Translate
        </button>
        <button class="btn" onclick="openModal('reflectLine')">
           Reflect about Line
        </button>
        <button class="btn" onclick="openModal('reflectPlane')">
          Reflect about Plane
        </button>
        <button class="btn" onclick="openModal('rotate')">
          Rotate
        </button>
        <button class="btn" data-tip="Flatten onto a plane: det = 0, idempotent, and irreversible." onclick="openModal('project')">
          Project onto Plane
        </button>
        <button class="btn" data-tip="Grow or shrink about the object's centre; volume scales by c³." onclick="openModal('scale')">
          Scale
        </button>
        <button class="btn" data-tip="Slide layers parallel to a direction; det = 1, so volume is unchanged." onclick="openModal('shear')">
          Shear
        </button>
        <button class="btn" data-tip="Type any 3×3 matrix — its columns are where i, j, k land." onclick="openModal('custom')">
          Custom Matrix
        </button>
        <button class="btn" data-tip="Re-apply the last n transformations — composition is just the product of their matrices." onclick="openModal('repeat')">
          Repeat…
        </button>
        <button class="btn" onclick="undoLast()">
          Undo
        </button>
        <button class="btn danger" onclick="askConfirm('reset')">
          Reset (irreversible)
        </button>
        <button class="btn danger" onclick="askConfirm('delete')">
          Delete object
        </button>
        <div id="confirm-bar">
          <div id="confirm-msg"></div>
          <div class="btn-row">
            <button class="btn danger" onclick="doConfirm()">Confirm</button>
            <button class="btn" onclick="cancelConfirm()">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Lines & Planes library ── -->
    <div class="section">
      <div class="section-head" id="shead-lp" onclick="toggleSection('lp')">
        Lines &amp; Planes
      </div>
      <div class="section-body" id="section-lp">
        <button class="btn" data-tip="Save a line r = a + t·d; pick it later inside Reflect, Rotate and Shear." onclick="openModal('addLine')">＋ Add Line</button>
        <button class="btn" data-tip="Save a plane ax + by + cz = d; pick it later inside Reflect and Project." onclick="openModal('addPlane')">＋ Add Plane</button>
        <div id="lp-list"></div>
      </div>
    </div>

    <div class="section" style="border-bottom:none">
      <div class="section-head">Matrix Stack</div>
    </div>
    <div id="stack-panel">
      <div id="stack-content">
        <div id="no-obj">Select an object to view its matrix stack</div>
      </div>
    </div>

  </div>

  <div id="viewport">
    <canvas id="gl"></canvas>
  </div>
</div>

<div id="modal-bg" class="modal-bg" style="display:none" onclick="closeModalBg(event)">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div class="desc" id="modal-desc"></div>
    <div id="modal-fields"></div>
    <div class="error-msg" id="modal-err"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="submitModal()">Apply</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../Common/tooltip.js"></script>
<script src="../Common/matrix.js"></script>
<script src="../Common/PrintMatrix.js"></script>
<script src="../Common/viewport.js"></script>
<script src="scene.js"></script>
<script src="ui.js"></script>
<script src="render.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Common/auth.js"></script>
<script src="../Common/api.js"></script>
<link rel="stylesheet" href="../Common/save.css"/>
<script src="../Common/save.js"></script>
<script src="save.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markov Chains</title>
  <link rel="stylesheet" href="../BaseStyle.css">
</head>
<body>
    
<div id="topbar">
  <div class="logo">VisuAL-1</div>
  <div class="version">Milestone 2</div>
  <div class="spacer"></div>
  <a class="topbar-back" href="../Home.html">← Home</a>
</div>

<div id="main">
 
  <div id="sidebar">
 
    <div class="section">
      <div class="section-head" id="shead-nodes" onclick="toggleSection('nodes')">
        Nodes
        <span style="display:flex;align-items:center;gap:6px;">
          <span id="node-count-badge" class="tag">0</span>
        </span>
      </div>
      <div class="section-body" id="section-nodes">
        <div id="node-list"></div>
        <button class="btn danger" id="btn-delete-node"
                onclick="deleteSelected()" style="display:none">
          Delete selected node
        </button>
      </div>
    </div>
 
    <div class="section">
      <div class="section-head" id="shead-sim" onclick="toggleSection('sim')">
        Simulation
      </div>
      <div class="section-body" id="section-sim">
        <div class="section-label">Distribution</div>
        <div id="mk-dist-panel"></div>
        <button class="btn" onclick="openDistModal()" id="btn-set-dist" style="display:none">
          Set initial distribution…
        </button>
 
        <div class="section-label" style="margin-top:12px">Controls</div>
        <div style="display:flex;gap:4px;margin-bottom:4px">
          <button class="btn" onclick="simStepBack()" style="flex:1;justify-content:center">←  Step</button>
          <button class="btn" onclick="simStep()" style="flex:1;justify-content:center">Step  →</button>
        </div>
        <button class="btn" id="btn-auto" onclick="toggleAuto()">▶  Auto-step</button>
        <div id="mk-speed-row">
          <label>Speed</label>
          <input type="range" id="mk-speed" min="1" max="10" value="5" oninput="onSpeedChange()"/>
        </div>
        <button class="btn" onclick="simReset()">Reset distribution</button>
 
        <div class="section-label" style="margin-top:12px">Options</div>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <input type="checkbox" id="chk-stationary" onchange="render()"/> Show stationary
        </label>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <input type="checkbox" id="chk-trail" checked onchange="render()"/> Show trail
        </label>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="chk-weights" checked onchange="render()"/> Show weights on edges
        </label>
      </div>
    </div>
 
    <div class="section">
      <div class="section-head">Probability Plot</div>
      <div class="section-body">
        <canvas id="mk-plot-canvas" style="width:100%;height:140px;display:block"></canvas>
      </div>
    </div>

    <div class="section" style="border-bottom:none">
      <div class="section-head">Transition Matrix</div>
    </div>
    <div id="stack-panel">
      <div id="mk-matrix-panel">
        <div id="no-obj">Add nodes to see the matrix</div>
      </div>
    </div>
 
  </div>
 
  <div id="viewport" style="position:relative;overflow:hidden;">
    <div id="mk-toolbar">
      <button class="mk-mode-btn active" id="btn-mode-node" onclick="setMode('node')">Add Node</button>
      <button class="mk-mode-btn"        id="btn-mode-edge" onclick="setMode('edge')">Add Edge</button>
    </div>
    <div id="mk-hint">Click the canvas to place a node</div>
    <div id="mk-step-badge">Step 0</div>
    <canvas id="mk-canvas"></canvas>
  </div>
 
</div>
 
<div id="modal-bg" class="modal-bg" style="display:none" onclick="closeBgClick(event)">
  <div class="modal">
    <h3 id="modal-title">Set Edge Weight</h3>
    <div class="desc" id="modal-desc"></div>
    <div class="field-row">
      <label>w</label>
      <input id="mf-weight" type="text" value="1" placeholder="e.g. 0.5"/>
    </div>
    <div class="error-msg" id="modal-err"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn danger" id="btn-delete-edge" onclick="deleteEdge()" style="display:none">Delete</button>
      <button class="btn primary" onclick="submitEdgeModal()">Apply</button>
    </div>
  </div>
</div>
 
<!-- Initial distribution modal -->
<div id="dist-modal-bg" class="modal-bg" style="display:none" onclick="closeDistModalBg(event)">
  <div class="modal">
    <h3>Set Initial Distribution</h3>
    <div class="desc">Enter a probability for each node. Values will be normalised to sum to 1.</div>
    <div id="dist-modal-fields"></div>
    <div class="error-msg" id="dist-modal-err"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeDistModal()">Cancel</button>
      <button class="btn primary" onclick="submitDistModal()">Apply</button>
    </div>
  </div>
</div>
 
<script src="markov.js"></script>
<script src="scene.js"></script>
<script src="plot.js"></script>
<script src="ui.js"></script>
<script src="render.js"></script>
</body>
</html>
